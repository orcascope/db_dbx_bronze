bundle:
  name: chpk-propane-ingestion

include:
  - resources/*.yml

# Only environment INFRASTRUCTURE lives here (workspace host, mode, run_as).
# Each job (one per pipeline layer/script) is governed in its own file under
# resources/ and carries its own knobs + per-environment overrides.
targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://<dev-workspace>.azuredatabricks.net

  test:
    mode: development
    workspace:
      host: https://<test-workspace>.azuredatabricks.net

  prod:
    mode: production
    workspace:
      host: https://<prod-workspace>.azuredatabricks.net
    run_as:
      service_principal_name: <prod-service-principal-app-id>
